---
configuration:
  api_key:
    name: Ключ API
    description: >-
      Используется в обе стороны, если ниже не задан отдельный ключ для
      синтеза. Локальному серверу, которому ключ не нужен, можно оставить
      пустым.
  languages:
    name: Языки
    description: >-
      Через пробел, не через запятую. Assist предложит этот аддон только
      для перечисленных здесь языков.
  stt_url:
    name: Адрес распознавания
    description: >-
      Любая точка входа, совместимая с OpenAI, например
      https://api.openai.com/v1 или https://api.mistral.ai/v1.
  stt_model:
    name: Модель распознавания
    description: >-
      Модель распознавания речи, например gpt-4o-mini-transcribe. Пусто —
      распознавание выключено, аддон работает только голосом.
  stt_mode:
    name: Режим распознавания
    description: >-
      batch отправляет готовую запись одним запросом и работает везде.
      streaming просит ту же точку входа отдавать текст по мере готовности.
      realtime открывает WebSocket и требует OpenAI — см. документацию.
  tts_url:
    name: Адрес синтеза
    description: >-
      Любая точка входа синтеза, совместимая с OpenAI. У Mistral её нет,
      поэтому при распознавании через Voxtral здесь должен быть другой адрес.
  tts_api_key:
    name: Ключ API для синтеза
    description: >-
      Нужен, только если распознавание и синтез идут к разным провайдерам.
      Пусто — берётся ключ выше.
  tts_model:
    name: Модель синтеза
    description: >-
      Модель синтеза речи, например gpt-4o-mini-tts. Пусто — синтез выключен,
      аддон работает только слухом.
  tts_voices:
    name: Голоса
    description: >-
      Через пробел. Пусто — все голоса, которые отдаёт точка входа; обычно так
      и нужно, конкретный голос выбирается потом в ассистенте.
  tts_streaming:
    name: Потоковый синтез
    description: >-
      Синтезировать по предложениям, чтобы речь начиналась раньше, чем ответ
      дописан до конца. Требуется Home Assistant 2025.7 или новее; на старых
      версиях аддон дождётся ответа целиком.
  tts_speed:
    name: Скорость речи
    description: >-
      1.0 — собственный темп модели. От 0.25 до 4.0.
  tts_instructions:
    name: Указания голосу
    description: >-
      Каким должен быть голос, например «говори спокойно». Принимает только
      gpt-4o-mini-tts, остальные модели ответят ошибкой.
  log_level:
    name: Уровень логирования
    description: >-
      Сколько подробностей попадает в лог аддона. При проблеме ставьте debug.
network:
  10300/tcp: Протокол Wyoming. Home Assistant находит аддон сам; порт открыт
    наружу для клиентов вне Home Assistant.

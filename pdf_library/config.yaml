---
name: PDF Library
version: "0.8.1"
slug: pdf_library
description: Store and read PDF documents inside Home Assistant
url: https://github.com/fenyag7/ha-addons/tree/main/pdf_library
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:bookshelf
panel_title: Library
panel_admin: false
map:
  - type: share
    read_only: false
options:
  library_root: /share/pdf_library
  max_upload_mb: 100
  auto_cover: true
  language: auto
  log_level: info
schema:
  library_root: str
  max_upload_mb: int(1,500)
  auto_cover: bool
  language: list(auto|en|ru)
  log_level: list(trace|debug|info|warning|error)

configuration:
  library_root:
    name: Папка библиотеки
    description: >-
      Где хранятся документы. Доступна по Samba для массового импорта.
  max_upload_mb:
    name: Максимальный размер загрузки (МБ)
    description: Файлы больше этого размера будут отклонены.
  auto_cover:

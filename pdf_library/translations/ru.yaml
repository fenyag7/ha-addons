      Выключите, чтобы остались простые заглушки с названием.
  language:
    name: Язык интерфейса
    description: "auto — использовать язык браузера."
  log_level:
    name: Уровень логирования
    description: >-
      Сколько подробностей попадает в лог аддона. При проблеме ставьте debug.

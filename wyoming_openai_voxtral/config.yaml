  api_key: ""
  stt_url: https://api.mistral.ai/v1
  stt_model: voxtral-mini-latest
  languages: ru en
  log_level: info
schema:
  api_key: password
  stt_url: url
  stt_model: str
  languages: str
  log_level: list(debug|info|warning|error)
